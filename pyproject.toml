[project]
name = "skinpulse"
version = "1.0.0"
description = "CS2 YouPin898 buy-order rank monitor with WeChat alerts and a local dashboard"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pycryptodome>=3.20",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "apscheduler>=3.10,<4",
  "pydantic>=2.7",
  "tomli-w>=1.0",
  "keyring>=25",
  "typer>=0.12",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "freezegun>=1.5", "ruff>=0.5", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skinpulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # 让 `from tests.conftest import ...` 可用
markers = ["live: hits real network; skipped by default"]
addopts = "-m 'not live'"
# Suppress starlette's httpx deprecation warning (from testclient itself, not SkinPulse code).
# Remove when the project upgrades to httpx2.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*",
]

[tool.ruff]
line-length = 110
target-version = "py312"
